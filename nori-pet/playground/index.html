<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nori playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/nori-pet.css">
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --sunken: #eef0ec; --fg: #121815; --muted: #5b665f; --line: rgba(16, 24, 20, 0.1);
    --accent: #1f3a2e; --on-accent: #ffffff; --chip: #e3efe6; --chip-fg: #1f3a2e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1512; --surface: #161e1a; --sunken: #121a16; --fg: #eef0ea; --muted: #93a097; --line: rgba(255, 255, 255, 0.09); --accent: #f3ecdc; --on-accent: #0f1512; --chip: #22362b; --chip-fg: #a6e0bc; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f1512; --surface: #161e1a; --sunken: #121a16; --fg: #eef0ea; --muted: #93a097; --line: rgba(255, 255, 255, 0.09); --accent: #f3ecdc; --on-accent: #0f1512; --chip: #22362b; --chip-fg: #a6e0bc; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Geist, system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; max-width: 1180px; margin: 0 auto; padding: 32px 24px 160px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h1 { font: 500 34px/1.1 Fraunces, Georgia, serif; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; transition: border-color .2s, transform .2s; }
  .card.is-target { border-color: var(--chip-fg); transform: translateY(-2px); }
  .meta { font-size: 13px; color: var(--muted); }
  .title { font-size: 17px; font-weight: 500; margin: 2px 0 6px; }
  .why { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .chip { font-size: 12.5px; background: var(--chip); color: var(--chip-fg); padding: 3px 10px; border-radius: 99px; }
  .apply { font: 500 14px Geist, sans-serif; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 99px; padding: 9px 16px; cursor: pointer; }
  aside { position: sticky; top: 16px; align-self: start; display: grid; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 10px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns button, .btns select { font: 500 12.5px Geist, sans-serif; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--sunken); color: var(--fg); cursor: pointer; }
  .btns button:hover { border-color: var(--muted); }
  .note-in { display: flex; gap: 6px; margin-top: 8px; }
  .note-in input { flex: 1; min-width: 0; font: 14px ui-monospace, Consolas, monospace; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); color: var(--fg); }
  ol.log { margin: 0; padding: 0 0 0 18px; max-height: 180px; overflow: auto; font-size: 12.5px; color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <section>
    <h1>6 jobs today. 3 ready to send.</h1>
    <p class="sub">Nori playground. Drag Nori onto a job, click to pet, right-click for settings, Esc to tuck away.</p>
    <div id="jobs"></div>
  </section>
  <aside>
    <div class="panel"><h2>Flows</h2><div class="btns" id="flows"></div></div>
    <div class="panel"><h2>App events</h2><div class="btns" id="events"></div>
      <div class="note-in"><input id="note" value="482 913" aria-label="Note text"><button class="apply" id="hold" style="padding:6px 12px">Hold note</button></div></div>
    <div class="panel"><h2>Bubbles</h2><div class="btns" id="bubbles"></div></div>
    <div class="panel"><h2>Every animation</h2><div class="btns" id="rows"></div></div>
    <div class="panel"><h2>Nori</h2><div class="btns" id="settings"></div><p class="hint" id="spent"></p></div>
    <div class="panel"><h2>What Nori said</h2><ol class="log" id="log"></ol></div>
  </aside>
</main>
<script type="module">
import { NoriPet, REACTIONS } from "../src/index.js";

const JOBS = [
  { id: "acme", company: "Acme", title: "Product analyst", where: "Remote, US", fit: 86, why: "You've run the same A/B pipeline they describe, in SQL and dbt." },
  { id: "ramp", company: "Ramp", title: "Data analyst, growth", where: "New York", fit: 81, why: "Your lifecycle dashboards match their first-90-days brief." },
  { id: "linear", company: "Linear", title: "Analytics engineer", where: "Remote", fit: 77, why: "dbt models and Looker at your last two jobs; one gap: Snowflake." },
];
const $ = (s) => document.querySelector(s);
const button = (parent, label, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn; $(parent).appendChild(b); return b; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

$("#jobs").innerHTML = JOBS.map((j) => `
  <article class="card" data-nori-drop="${j.id}">
    <div class="meta">${j.company} · ${j.where}</div>
    <div class="title">${j.title}</div>
    <p class="why">${j.why}</p>
    <div class="row"><span class="chip">${j.fit}% fit</span><button class="apply" data-apply="${j.id}">Apply · 25s</button></div>
  </article>`).join("");

let nori;
async function start(opts = {}) {
  nori?.destroy();
  nori = await NoriPet.create({ assets: "../assets/", onPet: () => "6 new jobs today, 3 are ready to send.", ...opts });
  window.nori = nori; // handy in the console
  nori.on("say", (b) => { const li = document.createElement("li"); li.textContent = [b.title, b.text].filter(Boolean).join(": "); $("#log").prepend(li); });
  nori.on("drop", async ({ id }) => {
    const job = JOBS.find((j) => j.id === id);
    document.querySelectorAll(".card").forEach((c) => c.classList.toggle("is-target", c.dataset.noriDrop === id));
    const yes = await nori.react("wait", { say: `Want me to prep ${job.company}'s application?`, tone: "info", actions: [{ label: "Prep it", value: true }, { label: "Not now", value: false }] });
    document.querySelectorAll(".card").forEach((c) => c.classList.remove("is-target"));
    if (!yes) { nori.react("idle"); return; }
    nori.react("preparing", { say: `Tailoring your resume for ${job.company}…` });
    await wait(2600);
    nori.react("prepared", { note: "1 gap", say: `${job.company} is ready: resume tailored, 2 answers drafted, 1 gap to check.`, tone: "success", ms: 6000 });
  });
  nori.on("open", () => nori.say("This would open Nori's panel: today's plan and everything Nori did."));
  return nori;
}
await start();

async function runApply(job) {
  const t0 = Date.now();
  const title = `${job.company} · ${job.title}`;
  nori.progress({ title, step: "Opening the application form", percent: 6, startedAt: t0 });
  await wait(1800); nori.progress({ title, step: "Attaching your tailored resume", percent: 24 });
  await wait(2200); nori.progress({ title, step: "Answering 9 questions from your answers", percent: 52 });
  await wait(2600); nori.progress({ title, step: `Waiting for ${job.company}'s email code`, percent: 70 }); nori.react("awaiting-code");
  await wait(2400); nori.react("code", { note: "482 913", say: `${job.company} sent a code. Typing it in.`, ms: 2600 });
  await wait(3000); nori.progress({ title, step: "Submitting", percent: 92 }); nori.react("submitting");
  await wait(2200); nori.progressDone(`Sent to ${job.company} in ${Math.round((Date.now() - t0) / 1000)}s. Receipt saved.`);
}
document.querySelectorAll("[data-apply]").forEach((b) => (b.onclick = () => runApply(JOBS.find((j) => j.id === b.dataset.apply))));

button("#flows", "Run an apply", () => runApply(JOBS[0]));
button("#flows", "Morning hello", () => nori.react("shortlist-ready", { say: "Morning! 6 new jobs today, 3 are ready to send." }));
button("#flows", "Point at Apply", () => nori.pointAt(document.querySelector("[data-apply]"), "Tap here to send Acme's application."));
button("#flows", "Needs an answer", async () => {
  const v = await nori.react("needs-user", { say: "Ramp asks: are you open to relocating to New York?", actions: [{ label: "Yes", value: "yes" }, { label: "No", value: "no" }] });
  nori.react("idle", { say: v === "yes" ? "Saved. I'll remember that." : "Got it, remote and local only.", tone: "success" });
});

const lines = {
  hello: "Hi, I'm Nori. I find jobs you're likely to get and send them in about 25 seconds.",
  "shortlist-ready": "6 new jobs today, 3 ready to send.",
  preparing: "Tailoring your resume for Acme…",
  prepared: "Acme is ready: resume tailored, 2 answers drafted, 1 gap.",
  applying: "Filling Acme's form…",
  submitting: "Sending it now…",
  "awaiting-code": "Waiting for Acme's email code.",
  code: "Acme sent a code. Typing it in.",
  submitted: "Sent to Acme in 23s.",
  "needs-user": "Stripe needs one answer from you before I send it.",
  captcha: "Stripe showed a captcha. I parked it for you; it takes about 30s.",
  failed: "Lever's form didn't load. I'll retry in 10 minutes.",
  reply: "Linear replied about Analytics engineer.",
  interview: "Interview request from Linear! It's in your inbox.",
  offer: "Offer from Ramp!",
  rejection: "Acme passed on Product analyst. Their loss, and it helps me aim better.",
  "cap-reached": "That's today's 10. I'll pick up again tomorrow at 8.",
  idle: "Back to waiting.",
};
const tones = { "needs-user": "alert", captcha: "alert", failed: "error", submitted: "success", interview: "success", offer: "success" };
for (const ev of Object.keys(REACTIONS)) button("#events", ev, () => nori.react(ev, { say: lines[ev], tone: tones[ev], note: ev === "code" ? $("#note").value : undefined }));
$("#hold").onclick = () => nori.react("hold", { note: $("#note").value });

button("#bubbles", "Say", () => nori.say("Nothing new right now. I'll check the boards again at 2pm."));
button("#bubbles", "Alert", () => nori.say("Two applications need you.", { tone: "alert", title: "Needs you" }));
button("#bubbles", "Error", () => nori.say("Couldn't reach Workday. Retrying in 5 minutes.", { tone: "error", title: "Didn't go through" }));
button("#bubbles", "Ask", () => nori.ask("Use your Stripe referral on this one?", [{ label: "Use it", value: 1 }, { label: "Skip", value: 0 }]));
button("#bubbles", "Progress", () => runApply(JOBS[1]));

for (const id of Object.keys(nori.manifest.rows)) button("#rows", nori.manifest.rows[id].label + (id.endsWith("-left") || id.endsWith("-right") ? ` (${id.split("-")[1]})` : ""), () => nori.play(id));

for (const s of ["s", "m", "l"]) button("#settings", `Size ${s.toUpperCase()}`, () => nori.setSize(s));
button("#settings", "Mute", (e) => { nori.mute(!nori.muted); e.target.textContent = nori.muted ? "Unmute" : "Mute"; });
button("#settings", "Tuck away", () => (nori.tucked ? nori.untuck() : nori.tuck()));
button("#settings", "Reduced motion", (e) => { const on = !nori.reduced; start({ reducedMotion: on }); e.target.textContent = on ? "Full motion" : "Reduced motion"; });
button("#settings", "Theme", () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : r.dataset.theme === "light" ? "dark" : matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"; });
</script>
</body>
</html>
