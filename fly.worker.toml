# Worker: collection, matching, tailoring and applying. No public ports. Deploy: fly deploy -c fly.worker.toml
# `app` is a placeholder until the new Fly app is created. Secrets are set with `fly secrets set`, never here.
app = "norinote-worker"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"
  build-target = "worker"

[env]
  NODE_ENV = "production"
  # The app is one site now: apps/landing serves the landing page, sign-in, onboarding and the dashboard.
  WEB_URL = "https://norinote.xyz"
  API_URL = "https://api.norinote.xyz"
  # Dry runs: every run fills the form and stops before submit. Switched back off on 2026-11-07 until the inbox addresses
  # used on applications (in.norinote.xyz) receive mail and forward it to the user. "true" sends approved applications.
  ALLOW_REAL_SUBMIT = "false"
  # Sender for forwarded inbox mail (Resend, domain verified); RESEND_API_KEY is a secret.
  MAIL_FROM = "Norinote <hello@norinote.xyz>"
  BROWSER_POOL_SIZE = "2"
  # Generated files: written here, copied to Supabase Storage (S3 API). Both apps must use the same ARTIFACTS_DIR so
  # the keys match. S3_ENDPOINT is https://<project-ref>.supabase.co/storage/v1/s3; the keys are secrets.
  # Database connections, over Supabase's direct connection (60 at most, shared by both apps; docs/deploy.md).
  # API 5 + 2, worker 10 + 5, plus a pg-boss listener each: about 24.
  # Collection runs many polls at once; queue workers fetch and finish jobs.
  DB_POOL_MAX = "10"
  QUEUE_POOL_MAX = "5"
  ARTIFACTS_DIR = "/app/data/artifacts"
  S3_REGION = "us-west-1"
  S3_BUCKET = "artifacts"

[[vm]]
  # Chromium needs the memory; collection needs steady CPU.
  size = "shared-cpu-2x"
  memory = "2gb"
